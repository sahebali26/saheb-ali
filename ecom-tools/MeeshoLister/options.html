<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Manage Products</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 20px auto; }
    label { display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 6px; }
    button { margin: 8px 4px; padding: 8px 16px; }
    .product-card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>Your Product Records</h2>
  <div id="productList"></div>
  <hr>
  <h3>Add New Product</h3>
  <form id="addForm">
    <label>Product Name:</label>
    <input type="text" id="pName" required>
    <label>Description:</label>
    <textarea id="pDesc" rows="4"></textarea>
    <label>MRP (₹):</label>
    <input type="number" id="pMrp">
    <label>Selling Price (₹):</label>
    <input type="number" id="pPrice">
    <label>Shipping Charge (₹):</label>
    <input type="number" id="pShipping">
    <label>Category (as shown on form):</label>
    <input type="text" id="pCategory">
    <label>Image URL(s) (comma separated):</label>
    <input type="text" id="pImages" placeholder="https://...">
    <button type="submit">💾 Save Product</button>
  </form>
  <script src="options.js"></script>
</body>
</html>
