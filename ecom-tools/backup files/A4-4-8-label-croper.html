<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lebely – Meesho Label Cropper (8‑Label A4)</title>

    <!-- PDF libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js">
    </script>

    <style>
        /* ── Reset & Variables ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #333;
            --subtext: #494949;
            --border: #e1e1e1;
            --shadow: rgba(0, 0, 0, 0.1);
            --radius: 8px;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            max-width: 960px;
            width: 100%;
        }

        /* ── Card ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 0 20px var(--shadow);
            padding: 30px 35px;
            margin-bottom: 24px;
        }

        .card h1 {
            font-size: 1.9rem;
            margin-bottom: 6px;
        }

        .card p.sub {
            color: var(--subtext);
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        /* ── Form elements ── */
        label {
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 4px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fafafa;
            font-size: 0.95rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 30px;
            align-items: center;
            margin-top: 14px;
        }

        .row .group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
        }

        .group label.opt {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 400;
            font-size: 0.95rem;
            transition: background 0.2s;
            user-select: none;
        }

        .group label.opt:hover {
            background: #f0f0f0;
        }

        .group label.opt input[type="radio"] {
            margin: 0 3px 0 0;
            cursor: pointer;
        }

        .group-label {
            font-weight: 600;
            font-size: 0.95rem;
            margin-right: 4px;
        }

        /* ── Progress ── */
        progress {
            width: 100%;
            height: 20px;
            border-radius: var(--radius);
            overflow: hidden;
            appearance: none;
            margin: 8px 0 4px;
        }
        progress::-webkit-progress-bar {
            background: #eee;
            border-radius: var(--radius);
        }
        progress::-webkit-progress-value {
            background: var(--primary);
            border-radius: var(--radius);
        }

        #message {
            font-size: 0.95rem;
            min-height: 22px;
            color: #c0392b;
            margin-top: 4px;
        }

        /* ── Buttons ── */
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius);
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s;
            display: inline-block;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }

        /* ── Filter ── */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            margin-top: 10px;
        }

        .filter-row select {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fafafa;
            font-size: 0.95rem;
            min-width: 150px;
        }

        /* ── Preview ── */
        .preview {
            display: none;
            margin-top: 6px;
        }
        .preview h2 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .preview p {
            color: var(--subtext);
            margin-bottom: 14px;
        }

        #pagesContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: flex-start;
        }

        .pageWrapper {
            position: relative;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: var(--radius);
            box-shadow: 0 2px 6px var(--shadow);
            overflow: hidden;
            max-width: 220px;
        }
        .pageWrapper canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .card {
                padding: 18px 16px;
            }
            .card h1 {
                font-size: 1.4rem;
            }
            .row {
                gap: 12px;
            }
            .group label.opt {
                font-size: 0.85rem;
                padding: 4px 10px;
            }
        }

        /* utility */
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ─── MAIN CARD ─── -->
        <div class="card">
            <h1>📦 Meesho Shipping Label Cropper</h1>
            <p class="sub">
                Upload your PDF and we'll crop labels automatically.
                Choose <strong>Label Printer</strong>, <strong>A4 4‑label</strong>, or
                <strong>A4 8‑label</strong> layout.
            </p>

            <!-- File input -->
            <label for="fileInput">Select PDF:</label>
            <input type="file" id="fileInput" accept="application/pdf" />

            <!-- Options -->
            <div class="row">
                <div class="group">
                    <span class="group-label">Layout:</span>
                    <label class="opt">
                        <input type="radio" name="layoutMode" value="label" checked /> Label Printer
                    </label>
                    <label class="opt">
                        <input type="radio" name="layoutMode" value="a4" /> A4 4‑label
                    </label>
                    <label class="opt">
                        <input type="radio" name="layoutMode" value="a4-8" /> A4 8‑label
                    </label>
                </div>

                <div class="group">
                    <span class="group-label">Invoice:</span>
                    <label class="opt">
                        <input type="radio" name="invoiceMode" value="without" checked /> Without Invoices
                    </label>
                    <label class="opt">
                        <input type="radio" name="invoiceMode" value="with" /> With Invoices
                    </label>
                </div>

                <div class="group">
                    <span class="group-label">Sort:</span>
                    <label class="opt">
                        <input type="radio" name="sortBy" value="sku" checked /> SKU
                    </label>
                    <label class="opt">
                        <input type="radio" name="sortBy" value="partner" /> Delivery Partner
                    </label>
                </div>
            </div>

            <!-- Progress -->
            <label class="mt-16" style="display:block;">Processing Progress:</label>
            <progress id="progressBar" value="0" max="100"></progress>
            <div id="message"></div>

            <!-- Action buttons -->
            <div class="flex-wrap mt-8">
                <button class="btn" id="downloadButton" disabled>⬇ Download Cropped PDF</button>
                <button class="btn btn-secondary" id="resetButton">⟳ Reset</button>
            </div>

            <!-- Partner filter -->
            <div class="filter-row" id="filterRow" style="display:none;">
                <label for="partnerFilter" style="display:inline;font-weight:500;">Filter by Partner:</label>
                <select id="partnerFilter" disabled>
                    <option value="all">All</option>
                </select>
            </div>
        </div>

        <!-- ─── PREVIEW CARD ─── -->
        <div class="card preview" id="previewCard">
            <h2>📄 PDF Pages Preview</h2>
            <p>Pages are grouped and cropped automatically. Use the filter above to show specific partners.</p>
            <div id="pagesContainer"></div>
        </div>

    </div>

    <!-- ════════════════════════════════════════════════════════════ -->
    <!--  JAVASCRIPT                                              -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <script>
        // ─── CONFIG ───
        const TOP_ANCHOR = "Customer Address";
        const BOTTOM_ANCHOR = "SKU";
        const PARTNER_PRIORITY = ["delhivery", "ecom express", "shadowfax", "unknown"];

        // ─── DOM refs ───
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadButton');
        const resetBtn = document.getElementById('resetButton');
        const message = document.getElementById('message');
        const progressBar = document.getElementById('progressBar');
        const pagesContainer = document.getElementById('pagesContainer');
        const previewCard = document.getElementById('previewCard');
        const partnerFilter = document.getElementById('partnerFilter');
        const filterRow = document.getElementById('filterRow');

        // ─── State ───
        let pdfDoc = null;
        let pageDataList = [];
        let partnersFound = new Set();
        let skippedPages = 0;
        let originalFile = null;

        // ─── Helpers ───
        function setMessage(msg, isError = false) {
            message.textContent = msg;
            message.style.color = isError ? '#c0392b' : '#2e7d32';
        }

        function resetUI() {
            setMessage('');
            pagesContainer.innerHTML = '';
            pageDataList = [];
            partnersFound.clear();
            skippedPages = 0;
            partnerFilter.innerHTML = '<option value="all">All</option>';
            partnerFilter.disabled = true;
            filterRow.style.display = 'none';
            downloadBtn.disabled = true;
            progressBar.value = 0;
            previewCard.style.display = 'none';
            pdfDoc = null;
            originalFile = null;
        }

        // ─── File handling ───
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resetUI();
            originalFile = file;
            progressBar.value = 0;
            setMessage('Loading PDF…');

            const arrayBuffer = await file.arrayBuffer();
            const typedArray = new Uint8Array(arrayBuffer);

            try {
                const loadingTask = pdfjsLib.getDocument({ data: typedArray });
                pdfDoc = await loadingTask.promise;

                setMessage(`Processing ${pdfDoc.numPages} pages…`);
                await analyzeAndRenderAllPages(pdfDoc);
                sortPages();
                setupPartnerFilter();
                progressBar.value = 100;
                setMessage(`✅ Done. ${pageDataList.length} labels ready. ${skippedPages ? '⚠️ Skipped ' + skippedPages + ' page(s) missing anchors.' : ''}`);
                downloadBtn.disabled = false;
                previewCard.style.display = 'block';
            } catch (err) {
                setMessage('❌ Error loading PDF: ' + err.message, true);
                console.error(err);
            }
        });

        // ─── Reset ───
        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            resetUI();
        });

        // ─── Partner filter ───
        partnerFilter.addEventListener('change', () => {
            filterPages(partnerFilter.value);
        });

        // ─── Sort radio ───
        document.querySelectorAll('input[name="sortBy"]').forEach((radio) => {
            radio.addEventListener('change', () => {
                sortPages();
                filterPages(partnerFilter.value);
            });
        });

        // ─── Analyze PDF ───
        async function analyzeAndRenderAllPages(pdfDoc) {
            const numPages = pdfDoc.numPages;
            for (let i = 1; i <= numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();

                const { topY, bottomY, partner, sku } = findPageDetails(textContent, i);
                const rawViewport = page.getViewport({ scale: 1 });
                const gapAboveTop = topY != null ? rawViewport.height - topY : null;

                // Skip if either anchor missing
                if (topY == null || bottomY == null) {
                    skippedPages++;
                    progressBar.value = 10 + (i / numPages) * 50;
                    continue;
                }

                // Render thumbnail
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: ctx, viewport }).promise;

                const wrapper = document.createElement('div');
                wrapper.className = 'pageWrapper';
                wrapper.appendChild(canvas);
                pagesContainer.appendChild(wrapper);

                const cropRegion = calculateCropRegion(topY, bottomY, rawViewport.height, gapAboveTop);

                pageDataList.push({
                    pageIndex: i - 1,
                    partner: partner || 'Unknown',
                    sku: sku || 'N/A',
                    cropRegion,
                    pageWrapper: wrapper,
                });

                progressBar.value = 10 + (i / numPages) * 50;
                await new Promise((r) => setTimeout(r, 10));
            }
            filterPages('all');
        }

        // ─── Find anchors ───
        function findPageDetails(textContent, pageIndex) {
            let topY = null,
                bottomY = null,
                partner = null,
                sku = null;
            let skuLineIndex = -1;

            textContent.items.forEach((item, index) => {
                const text = item.str.trim();
                const y = item.transform[5];

                if (text.includes(TOP_ANCHOR)) topY = y;
                if (text.includes(BOTTOM_ANCHOR)) bottomY = y;

                const lower = text.toLowerCase();
                if (lower.includes('delhivery')) partner = 'Delhivery';
                else if (lower.includes('ecom express')) partner = 'Ecom Express';
                else if (lower.includes('shadowfax')) partner = 'Shadowfax';

                if (lower === 'sku') skuLineIndex = index;
                if (skuLineIndex !== -1 && index === skuLineIndex + 10) {
                    sku = text;
                    skuLineIndex = -1;
                }

                if (partner) partnersFound.add(partner);
            });

            return { topY, bottomY, partner, sku };
        }

        // ─── Crop region ───
       function calculateCropRegion(topY, bottomY, pageHeight) {
    if (topY != null && bottomY != null) {
        const top    = Math.max(topY, bottomY);
        const bottom = Math.min(topY, bottomY);
        const PAD    = 39; //  croped height
        return { x: 0, y: bottom - PAD, w: 595, h: (top - bottom) + PAD * 2 };
    }
    return { x: 0, y: 0, w: 595, h: pageHeight };
}

        // ─── Sort ───
        function sortPages() {
            const sortBy = document.querySelector('input[name="sortBy"]:checked').value;
            if (sortBy === 'sku') {
                pageDataList.sort((a, b) => a.sku.localeCompare(b.sku));
            } else {
                pageDataList.sort((a, b) => {
                    const ai = PARTNER_PRIORITY.indexOf(a.partner.toLowerCase());
                    const bi = PARTNER_PRIORITY.indexOf(b.partner.toLowerCase());
                    return ai - bi;
                });
            }
            pageDataList.forEach((item) => pagesContainer.appendChild(item.pageWrapper));
            filterPages(partnerFilter.value);
        }

        // ─── Filter ───
        function filterPages(value) {
            pageDataList.forEach((data) => {
                const partner = data.partner.toLowerCase();
                data.pageWrapper.style.display =
                    (value === 'all' || partner === value) ? 'inline-block' : 'none';
            });
        }

        // ─── Partner filter dropdown ───
        function setupPartnerFilter() {
            if (partnersFound.size > 0) {
                partnerFilter.disabled = false;
                filterRow.style.display = 'flex';
                for (const p of partnersFound) {
                    const opt = document.createElement('option');
                    opt.value = p.toLowerCase();
                    opt.textContent = p;
                    partnerFilter.appendChild(opt);
                }
            }
        }

        // ─── DOWNLOAD ────────────────────────────────────────────────────────
        downloadBtn.addEventListener('click', async () => {
            if (!pdfDoc || !originalFile) {
                setMessage('❌ No PDF loaded.', true);
                return;
            }

            try {
                setMessage('Generating PDF…');
                progressBar.value = 40;

                const layoutMode = document.querySelector('input[name="layoutMode"]:checked').value;
                const invoiceMode = document.querySelector('input[name="invoiceMode"]:checked').value;
                const sortBy = document.querySelector('input[name="sortBy"]:checked').value;

                const arrayBuffer = await originalFile.arrayBuffer();
                const pdfBytes = new Uint8Array(arrayBuffer);
                const sourcePdf = await PDFLib.PDFDocument.load(pdfBytes);
                const outputPdf = await PDFLib.PDFDocument.create();

                const pages = sourcePdf.getPages();

                if (layoutMode === 'label') {
                    // ── Label Printer: one per page ──
                    for (let i = 0; i < pageDataList.length; i++) {
                        const { pageIndex, cropRegion } = pageDataList[i];
                        const [copied] = await outputPdf.copyPages(sourcePdf, [pageIndex]);
                        copied.setCropBox(cropRegion.x, cropRegion.y, cropRegion.w, cropRegion.h);
                        outputPdf.addPage(copied);
                        progressBar.value = 40 + ((i + 1) / pageDataList.length) * 30;
                        await new Promise((r) => setTimeout(r, 5));
                    }
                } else {
                    // ── A4 Layout (4 or 8 labels per page) ──
                    const isEight = layoutMode === 'a4-8';
                    const cols = isEight ? 4 : 2;
                    const rows = 2; // both 4 and 8 use 2 rows; for 4, 2x2; for 8, 4x2
                    const totalPerPage = cols * rows; // 8 or 4

                    // Landscape A4 dimensions (before rotation)
                    const a4W = 842;
                    const a4H = 595;
                    const margin = 10;
                    const gap = 10;

                    const cellW = (a4W - 2 * margin - (cols - 1) * gap) / cols;
                    const cellH = (a4H - 2 * margin - (rows - 1) * gap) / rows;

                    for (let i = 0; i < pageDataList.length; i += totalPerPage) {
                        const a4Page = outputPdf.addPage([a4W, a4H]);

                        for (let j = 0; j < totalPerPage && (i + j) < pageDataList.length; j++) {
                            const idx = i + j;
                            const { pageIndex, cropRegion } = pageDataList[idx];

                            const col = j % cols;
                            const row = rows - 1 - Math.floor(j / cols); // top‑down

                            const xPos = margin + col * (cellW + gap);
                            const yPos = a4H - margin - cellH - row * (cellH + gap);

                            const embedded = await outputPdf.embedPage(pages[pageIndex], {
                                left: cropRegion.x,
                                bottom: cropRegion.y,
                                right: cropRegion.x + cropRegion.w,
                                top: cropRegion.y + cropRegion.h,
                            });

                            const labelW = cropRegion.w;
                            const labelH = cropRegion.h;

                            // decide whether to rotate 90°
                            const scaleDirect = Math.min(cellW / labelW, cellH / labelH);
                            const areaDirect = (labelW * scaleDirect) * (labelH * scaleDirect);

                            const scaleRot = Math.min(cellW / labelH, cellH / labelW);
                            const areaRot = (labelH * scaleRot) * (labelW * scaleRot);

                            if (areaRot > areaDirect) {
                                const s = scaleRot;
                                const sw = labelH * s;
                                const sh = labelW * s;
                                const cx = xPos + (cellW - sw) / 2 + sw;
                                const cy = yPos + (cellH - sh) / 2;
                                a4Page.drawPage(embedded, {
                                    x: cx,
                                    y: cy,
                                    width: labelW * s,
                                    height: labelH * s,
                                    rotate: PDFLib.degrees(90),
                                });
                            } else {
                                const s = scaleDirect;
                                const sw = labelW * s;
                                const sh = labelH * s;
                                const cx = xPos + (cellW - sw) / 2;
const cy = yPos + (cellH - sh) / 2;
a4Page.drawPage(embedded, {
    x: cx,
    y: cy,
    width: sw,
    height: sh,
});
                            }
                        }

                        // Draw grid lines (vertical)
                        for (let c = 1; c < cols; c++) {
                            const x = margin + c * (cellW + gap) - gap / 2;
                            a4Page.drawLine({
                                start: { x, y: margin },
                                end: { x, y: a4H - margin },
                                thickness: 1.5,
                                color: PDFLib.rgb(0.7, 0.7, 0.7),
                            });
                        }
                        // Draw horizontal line between rows
                        const yLine = a4H - margin - cellH - gap / 2;
                        a4Page.drawLine({
                            start: { x: margin, y: yLine },
                            end: { x: a4W - margin, y: yLine },
                            thickness: 1.5,
                            color: PDFLib.rgb(0.7, 0.7, 0.7),
                        });

                        progressBar.value = 40 + ((i + totalPerPage) / pageDataList.length) * 30;
                        await new Promise((r) => setTimeout(r, 5));
                    }

                    // Rotate all pages to portrait
                    const allPages = outputPdf.getPages();
                    allPages.forEach((p) => p.setRotation(PDFLib.degrees(90)));
                }

                progressBar.value = 90;
                const outBytes = await outputPdf.save();
                downloadPDF(outBytes, 'lebely-cropped.pdf');
                progressBar.value = 100;
                setMessage(`✅ Download complete. ${pageDataList.length} labels processed.`);
            } catch (err) {
                setMessage('❌ Download error: ' + err.message, true);
                console.error(err);
                progressBar.value = 0;
            }
        });

        // ─── Download helper ───
        function downloadPDF(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ─── Init ───
        resetUI();
        console.log('✅ Lebely Label Cropper loaded (A4 8‑label support)');
    </script>

</body>
</html>
